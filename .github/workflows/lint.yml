name: Linting

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-go-code:
    name: Lint Go Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 'stable'
          cache: true  # Caches go modules
          cache-dependency-path: go.sum

      # Download all dependencies upfront (will be cached)
      - name: Download Go dependencies
        run: |
          go mod download
          go mod verify

      # Cache Go build cache for faster compilation during linting
      - name: Cache Go build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/go-build
          key: ${{ runner.os }}-go-build-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-lint-
            ${{ runner.os }}-go-build-

      - name: Check go.mod version format
        run: "! grep -qE '^go [0-9]+\\.[0-9]+\\.[1-9][0-9]*$' go.mod || { echo 'ERROR: go.mod must not pin a non-zero Go patch version (go 1.26 or go 1.26.0 are fine; a dependency floor is always X.Y.0, never a later patch)'; exit 1; }"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.14.0
          only-new-issues: true
          # Enable golangci-lint's built-in caching (removes skip-cache: true)
          args: --timeout=5m
